<mat-form-field style="margin-bottom: 16px" class="product-create">
  <mat-label>Name</mat-label>
  <input matInput #txtName />
</mat-form-field>
<mat-form-field style="margin-bottom: 16px" class="product-create">
  <mat-label>Stock</mat-label>
  <input matInput type="number" min="0" value="0" #txtStock />
</mat-form-field>
<mat-form-field style="margin-bottom: 16px" class="product-create">
  <mat-label>Price</mat-label>
  <input matInput #txtPrice />
</mat-form-field>
<button
  mat-stroked-button
  class="product-create"
  (click)="create(txtName, txtPrice, txtStock)"
>
  Create Product
</button>
